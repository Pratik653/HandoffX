[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "handoffx"
version = "0.1.0"
description = "Research-grade finite-horizon intervention decision support and simulation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]
readme = "README.md"

[project.optional-dependencies]
research = ["scipy>=1.10", "matplotlib>=3.6", "pytest>=7", "sympy>=1.12"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
